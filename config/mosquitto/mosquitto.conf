# Mosquitto 2.0 – EMS Keltenstr. 21
# Anonymer Zugriff aus; jedes Konto hat genau die Rechte aus "acl".
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
autosave_interval 300

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Ohne TLS: Dienste im internen Docker-Netz und Geräte, die TLS nicht beherrschen
listener 1883

# Mit TLS: Standard für Geräte im LAN (eigene CA, siehe secrets/mqtt-tls/ca.crt)
listener 8883
certfile /mosquitto/tls/server.crt
keyfile /mosquitto/tls/server.key
cafile /mosquitto/tls/ca.crt
tls_version tlsv1.2

max_queued_messages 10000
